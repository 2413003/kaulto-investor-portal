<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ececec;--card:#fff;--ink:#000;--mut:#6b6b6b;--up:#0a8a55;--down:#d03a2f;--line:#dcdcdc;font-family:Sora,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#000;color:#fff;font-weight:700;font-size:20px}
.logo.big{width:56px;height:56px;border-radius:16px;font-size:32px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
.top{display:flex;align-items:center;gap:24px;padding:18px 0}
.top nav{display:flex;gap:4px;flex:1}
.top nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600}
.top nav button[aria-current=page]{background:#000;color:#fff}
.link{border:0;background:none;cursor:pointer;color:var(--mut);text-decoration:underline;padding:4px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:24px 0 0}
.big-n{font-size:clamp(36px,8vw,60px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #000;background:#fff;border-radius:999px;padding:10px 22px;font-weight:600;cursor:pointer}
.btn.dark{background:#000;color:#fff}
.card{background:var(--card);border-radius:20px;padding:20px;margin-top:16px}
.ranges{display:flex;gap:4px;margin-top:8px}
.ranges button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.ranges button[aria-pressed=true]{background:var(--bg);color:#000}
#ch{width:100%;height:240px;display:block;touch-action:none}
.empty{height:240px;display:grid;place-items:center;text-align:center;color:var(--mut);padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stats b{display:block;font-size:22px;letter-spacing:-.02em}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.chip{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg)}
.chip.pending{background:#fff1c9}
h2{font-size:18px;margin:0 0 4px}
label{display:block;font-weight:600;font-size:13px;margin-top:14px}
input,select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
input[type=checkbox]{width:auto;display:inline;margin:0 8px 0 0}
.auth{max-width:380px;margin:12vh auto 0;padding:0 20px}
.auth h1{font-size:26px;color:#000;margin:20px 0 4px;font-weight:700}
.auth .btn{width:100%;margin-top:18px}
.err{color:var(--down);font-size:13px;min-height:20px;margin:8px 0 0}
dialog{border:0;border-radius:20px;padding:24px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .row{justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot,collection,addDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1. Paste your Firebase web app config here (Project settings > Your apps).
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};

const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={currency:'GBP',range:'1Y',hide:false};
const DAYS={'1W':7,'1M':30,'3M':91,'1Y':365,'ALL':1e9};
let S={user:null,name:'',set:{...DEF},tx:[],nav:[],range:'1Y',ranged:false,view:'portfolio',mode:'in',err:''},subs=[];
const fmt=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:S.set.currency}).format(n);
const money=n=>S.set.hide?'••••':fmt(n);
const sgn=n=>(n<0?'−':'+')+money(Math.abs(n));
const cls=n=>n<0?'down':'up';
const day=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

if(CFG.apiKey.startsWith('YOUR_')){
  app.innerHTML=`<main class="auth"><span class="logo big">K</span><h1>Connect Firebase</h1><p class="mut">Paste your Firebase web app config into the CFG object near the top of this file, then reload.</p></main>`;
}else{
const fb=initializeApp(CFG),auth=getAuth(fb),db=getFirestore(fb);

onAuthStateChanged(auth,u=>{
  subs.forEach(f=>f());subs=[];
  S={...S,user:u,name:'',set:{...DEF},tx:[],nav:[],ranged:false,view:'portfolio',err:''};
  if(u){
    const ud=doc(db,'users',u.uid);
    subs.push(onSnapshot(ud,s=>{const d=s.data();if(d){S.name=d.name||'';S.set={...DEF,...d.settings};if(!S.ranged){S.range=S.set.range;S.ranged=true}}render()}));
    subs.push(onSnapshot(query(collection(ud,'transactions'),orderBy('createdAt','desc')),s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
    subs.push(onSnapshot(collection(db,'nav'),s=>{S.nav=s.docs.map(d=>({id:d.id,nav:d.data().nav})).sort((a,b)=>a.id<b.id?-1:1);render()}));
  }
  render();
});

function calc(){
  const done=S.tx.filter(t=>t.status==='completed'&&t.units),ms=t=>t.completedAt?.toMillis?.()??0,f=t=>t.type==='deposit'?1:-1;
  const units=done.reduce((a,t)=>a+f(t)*t.units,0),last=S.nav.at(-1),value=last?units*last.nav:0;
  const invested=done.reduce((a,t)=>a+f(t)*t.amount,0);
  const pend=S.tx.filter(t=>t.status==='pending'&&t.type==='withdrawal').reduce((a,t)=>a+t.amount,0);
  const first=Math.min(...done.map(ms));
  const all=S.nav.map(n=>{const t=Date.parse(n.id);return{t,v:done.filter(x=>ms(x)<=t).reduce((a,x)=>a+f(x)*x.units,0)*n.nav}}).filter(p=>p.t>=first&&p.v>0);
  let pts=all.filter(p=>p.t>=Date.now()-DAYS[S.range]*864e5);if(pts.length<2)pts=all.slice(-2);
  let delta=0,pc=0;
  if(pts.length>1){const a=pts[0],b=pts.at(-1),flow=done.filter(x=>ms(x)>a.t&&ms(x)<=b.t).reduce((s,x)=>s+f(x)*x.amount,0);delta=b.v-a.v-flow;pc=a.v?delta/a.v*100:0}
  return{value,invested,avail:value-pend,pts,delta,pc,ret:value-invested,retPc:invested>0?(value-invested)/invested*100:0}
}

function txList(n){
  const l=n?S.tx.slice(0,n):S.tx;
  if(!l.length)return`<p class="mut">No deposits or withdrawals yet. Make a deposit to start.</p>`;
  return l.map(t=>`<div class="tx"><div><b>${t.type==='deposit'?'Deposit':'Withdrawal'}</b><div class="mut">${day(t.createdAt?.toDate?.()??new Date())}</div></div><div style="text-align:right"><b>${t.type==='deposit'?'+':'−'}${money(t.amount)}</b><div><span class="chip ${t.status}">${t.status==='completed'?'Completed':'Pending'}</span></div></div></div>`).join('');
}

function chart(pts){
  if(pts.length<2)return`<div class="empty">Performance appears here once K confirms your first deposit.</div>`;
  const W=800,H=240,p=12,x0=pts[0].t,x1=pts.at(-1).t,vs=pts.map(q=>q.v),lo=Math.min(...vs),sp=(Math.max(...vs)-lo)||1;
  const X=t=>p+(t-x0)/((x1-x0)||1)*(W-2*p),Y=v=>H-p-(v-lo)/sp*(H-2*p);
  const d=pts.map((q,i)=>(i?'L':'M')+X(q.t).toFixed(1)+' '+Y(q.v).toFixed(1)).join('');
  return`<svg id="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Portfolio value over time"><path d="${d}L${X(x1)} ${H}L${X(x0)} ${H}Z" fill="rgba(0,0,0,.06)"/><path d="${d}" fill="none" stroke="#000" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cl" y1="0" y2="${H}" stroke="#000" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}
function hover(pts){
  const s=$('#ch');if(!s)return;const x0=pts[0].t,x1=pts.at(-1).t,tip=$('#tip'),line=$('#cl'),base=tip.innerHTML;
  s.onpointermove=e=>{const r=s.getBoundingClientRect(),fr=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),t=x0+fr*(x1-x0);
    const q=pts.reduce((a,b)=>Math.abs(b.t-t)<Math.abs(a.t-t)?b:a);
    const x=12+(q.t-x0)/((x1-x0)||1)*776;line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('visibility','visible');
    tip.textContent=day(new Date(q.t))+' · '+money(q.v)};
  s.onpointerleave=()=>{line.setAttribute('visibility','hidden');tip.innerHTML=base};
}

function render(){
  if(!S.user)return authView();
  const c=calc(),v=S.view;
  const nav=[['portfolio','Portfolio'],['activity','Activity'],['settings','Settings']].map(([k,l])=>`<button data-v="${k}" ${v===k?'aria-current="page"':''}>${l}</button>`).join('');
  let body='';
  if(v==='portfolio')body=`
    <h1>${esc(S.name?S.name+'’s portfolio':'Your portfolio')}</h1>
    <div class="big-n">${money(c.value)}</div>
    <div id="tip" class="${cls(c.delta)}">${c.pts.length>1?sgn(c.delta)+' ('+(c.pc>=0?'+':'')+c.pc.toFixed(2)+'%) in this period':'<span class="mut">No performance yet</span>'}</div>
    <div class="row" style="margin-top:16px"><button class="btn dark" data-d="deposit">Deposit</button><button class="btn" data-d="withdrawal">Withdraw</button></div>
    <div class="card">${chart(c.pts)}<div class="ranges">${Object.keys(DAYS).map(r=>`<button data-r="${r}" aria-pressed="${S.range===r}">${r}</button>`).join('')}</div></div>
    <div class="card stats"><div><span class="mut">Total return</span><b class="${cls(c.ret)}">${sgn(c.ret)}</b><span class="mut ${cls(c.ret)}">${c.retPc>=0?'+':''}${c.retPc.toFixed(2)}%</span></div><div><span class="mut">Money paid in</span><b>${money(c.invested)}</b></div><div><span class="mut">Available to withdraw</span><b>${money(c.avail)}</b></div></div>
    <div class="card"><h2>Recent activity</h2>${txList(5)}</div>`;
  else if(v==='activity')body=`<h1>Activity</h1><div class="card">${txList()}</div>`;
  else body=`<h1>Settings</h1><form class="card" id="sf"><label>Name<input name="name" value="${esc(S.name)}" autocomplete="name"></label><label>Currency<select name="currency">${['GBP','USD','EUR'].map(x=>`<option ${S.set.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Default chart range<select name="range">${Object.keys(DAYS).map(x=>`<option ${S.set.range===x?'selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" name="hide" ${S.set.hide?'checked':''}>Hide balances</label><p class="mut" id="sv">Changes save to your account automatically. Signed in as ${esc(S.user.email)}.</p></form>`;
  app.innerHTML=`<div class="wrap"><header class="top"><span class="logo">K</span><nav>${nav}</nav><button class="link" id="so">Sign out</button></header>${body}</div>`;
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;render()});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openDlg(b.dataset.d));
  $('#so').onclick=()=>signOut(auth);
  if(v==='portfolio')hover(c.pts);
  const sf=$('#sf');if(sf)sf.onchange=async()=>{const f=new FormData(sf);
    await setDoc(doc(db,'users',S.user.uid),{name:f.get('name').trim(),settings:{currency:f.get('currency'),range:f.get('range'),hide:!!f.get('hide')}},{merge:true});
    const sv=$('#sv');if(sv)sv.textContent='Saved to your account.'};
}

function authView(){
  const up=S.mode==='up';
  app.innerHTML=`<main class="auth"><span class="logo big">K</span><h1>${up?'Create your K account':'Sign in to K'}</h1><form id="af">${up?'<label>Name<input name="name" autocomplete="name" required></label>':''}<label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required></label><p class="err" role="alert">${S.err}</p><button class="btn dark">${up?'Create account':'Sign in'}</button></form><p><button class="link" id="sw">${up?'Have an account? Sign in':'New to K? Create an account'}</button></p></main>`;
  $('#sw').onclick=()=>{S.mode=up?'in':'up';S.err='';authView()};
  $('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    try{
      if(up){const r=await createUserWithEmailAndPassword(auth,f.get('email'),f.get('pw'));await setDoc(doc(db,'users',r.user.uid),{name:f.get('name').trim(),settings:DEF,createdAt:serverTimestamp()})}
      else await signInWithEmailAndPassword(auth,f.get('email'),f.get('pw'));
    }catch(x){S.err={'auth/invalid-credential':'Email or password is wrong.','auth/email-already-in-use':'An account with this email already exists. Sign in instead.','auth/weak-password':'Use a password of at least 6 characters.'}[x.code]||'Something went wrong. Try again.';authView()}};
}

function openDlg(type){
  const dep=type==='deposit',c=calc(),ref='K-'+S.user.uid.slice(0,6).toUpperCase();
  dlg.innerHTML=`<form id="mf"><h2>${dep?'Deposit':'Withdraw'}</h2><label>Amount (${S.set.currency})<input name="a" type="number" min="1" step="0.01" inputmode="decimal" required></label><p class="mut">${dep?`Send your transfer to K with the reference ${ref}. Your balance updates once K confirms it.`:`You can withdraw up to ${fmt(Math.max(0,c.avail))}. K confirms each withdrawal before it leaves your balance.`}</p><p class="err" role="alert"></p><div class="row"><button type="button" class="btn" id="cx">Cancel</button><button class="btn dark">${dep?'Request deposit':'Request withdrawal'}</button></div></form>`;
  dlg.showModal();$('#cx').onclick=()=>dlg.close();
  $('#mf').onsubmit=async e=>{e.preventDefault();const a=Math.round(parseFloat(new FormData(e.target).get('a'))*100)/100,er=dlg.querySelector('.err');
    if(!(a>0)){er.textContent='Enter an amount above zero.';return}
    if(!dep&&a>c.avail+1e-9){er.textContent=`You can withdraw up to ${fmt(Math.max(0,c.avail))}.`;return}
    try{await addDoc(collection(db,'users',S.user.uid,'transactions'),{type,amount:a,status:'pending',createdAt:serverTimestamp()});dlg.close()}
    catch{er.textContent='The request did not send. Check your connection and try again.'}};
}
}
</script>
</body>
</html>
<!--
DATA MODEL (Firestore)
  users/{uid}                      { name, settings:{currency,range,hide}, createdAt }   written by the user
  users/{uid}/transactions/{id}    user creates: { type:'deposit'|'withdrawal', amount, status:'pending', createdAt }
                                   K completes it (console or Admin SDK): status:'completed', units, completedAt (timestamp)
  nav/{YYYY-MM-DD}                 { nav: price per unit } written by K only. Portfolio value = your units x latest nav.

FIRESTORE RULES (users can never write balances, units or nav)
rules_version = '2';
service cloud.firestore { match /databases/{db}/documents {
  match /users/{uid} {
    allow read: if request.auth.uid == uid;
    allow create, update: if request.auth.uid == uid && request.resource.data.keys().hasOnly(['name','settings','createdAt']);
    match /transactions/{id} {
      allow read: if request.auth.uid == uid;
      allow create: if request.auth.uid == uid && request.resource.data.keys().hasOnly(['type','amount','status','createdAt'])
        && request.resource.data.status == 'pending' && request.resource.data.type in ['deposit','withdrawal']
        && request.resource.data.amount is number && request.resource.data.amount > 0;
    }
  }
  match /nav/{d} { allow read: if request.auth != null; }
}}
-->
