<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ececec;--card:#fff;--ink:#000;--mut:#6b6b6b;--up:#0a8a55;--down:#d03a2f;--line:#dcdcdc;font-family:Sora,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #000;outline-offset:2px}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#000;color:#fff;font-weight:700;font-size:20px}
.logo.big{width:56px;height:56px;border-radius:16px;font-size:32px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
.top{display:flex;align-items:center;gap:24px;padding:18px 0}
.wm{font-size:18px;letter-spacing:-.02em;margin-left:-12px}
@media(max-width:640px){.wm{display:none}}
.top nav{display:flex;gap:4px;flex:1}
.top nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600}
.top nav button[aria-current=page]{background:#000;color:#fff}
.link{border:0;background:none;cursor:pointer;color:var(--mut);text-decoration:underline;padding:4px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:24px 0 0}
.big-n{font-size:clamp(36px,8vw,60px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #000;background:#fff;border-radius:999px;padding:10px 22px;font-weight:600;cursor:pointer}
.btn.dark{background:#000;color:#fff}
.card{background:var(--card);border-radius:20px;padding:20px;margin-top:16px}
.ranges{display:flex;gap:4px;margin-top:8px}
.ranges button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.ranges button[aria-pressed=true]{background:var(--bg);color:#000}
#ch{width:100%;height:240px;display:block;touch-action:none}
.empty{height:240px;display:grid;place-items:center;text-align:center;color:var(--mut);padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stats b{display:block;font-size:22px;letter-spacing:-.02em}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.chip{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg)}
.chip.pending{background:#fff1c9}
h2{font-size:18px;margin:0 0 4px}
label{display:block;font-weight:600;font-size:13px;margin-top:14px}
input,select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
input[type=checkbox]{width:auto;display:inline;margin:0 8px 0 0}
.auth{max-width:380px;margin:12vh auto 0;padding:0 20px}
.auth h1{font-size:26px;color:#000;margin:20px 0 4px;font-weight:700}
.auth .btn{width:100%;margin-top:18px}
.err{color:var(--down);font-size:13px;min-height:20px;margin:8px 0 0}
dialog{border:0;border-radius:20px;padding:24px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .row{justify-content:flex-end;margin-top:16px}
@media print{.top,.btn,.ranges,.row{display:none!important}body{background:#fff}.card{border:1px solid #ddd}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot,collection,addDoc,query,orderBy,serverTimestamp,getDoc,updateDoc,collectionGroup,where} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

// 1. Paste your Firebase web app config here (Project settings > Your apps).
const CFG={apiKey:"AIzaSyAJioajokVOh_a0DH9vldeCAz2jzTTzMG8",authDomain:"kaulto-investor-dashboard.firebaseapp.com",projectId:"kaulto-investor-dashboard",storageBucket:"kaulto-investor-dashboard.firebasestorage.app",messagingSenderId:"502424779951",appId:"1:502424779951:web:8cfe3de97dcfcc2614685a"};

const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OPEN=true; // true: any Google account can sign up. false: only emails approved in Admin.
const DEF={currency:'GBP',range:'1Y',hide:false};
const DAYS={'1W':7,'1M':30,'3M':91,'1Y':365,'ALL':1e9};
let S={user:null,name:'',set:{...DEF},tx:[],nav:[],range:'1Y',ranged:false,view:'portfolio',mode:'in',err:'',admin:false,denied:false,pend:[],bank:''},subs=[];
const fmt=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:S.set.currency}).format(n);
const money=n=>S.set.hide?'••••':fmt(n);
const sgn=n=>(n<0?'−':'+')+money(Math.abs(n));
const cls=n=>n<0?'down':'up';
const day=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

if(CFG.apiKey.startsWith('YOUR_')){
  app.innerHTML=`<main class="auth"><span class="logo big">K</span><h1>Connect Firebase</h1><p class="mut">Paste your Firebase web app config into the CFG object near the top of this file, then reload.</p></main>`;
}else{
const fb=initializeApp(CFG),auth=getAuth(fb),db=getFirestore(fb);

onAuthStateChanged(auth,async u=>{
  subs.forEach(f=>f());subs=[];
  S={...S,user:u,name:'',set:{...DEF},tx:[],nav:[],ranged:false,view:'portfolio',err:'',admin:false,denied:false,pend:[],bank:''};
  if(u){
    if(!OPEN){try{if(!(await getDoc(doc(db,'allowed',(u.email||'').toLowerCase()))).exists()){S.denied=true;return render()}}catch{S.denied=true;return render()}}
    try{S.admin=(await getDoc(doc(db,'admins',u.uid))).exists()}catch{}
    const ud=doc(db,'users',u.uid);
    subs.push(onSnapshot(ud,s=>{const d=s.data();if(d){S.name=d.name||'';S.set={...DEF,...d.settings};if(!S.ranged){S.range=S.set.range;S.ranged=true}}else if(!s.metadata.fromCache)setDoc(ud,{name:u.displayName||'',settings:DEF,createdAt:serverTimestamp()});render()}));
    subs.push(onSnapshot(query(collection(ud,'transactions'),orderBy('createdAt','desc')),s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
    subs.push(onSnapshot(collection(db,'nav'),s=>{S.nav=s.docs.map(d=>({id:d.id,nav:d.data().nav})).sort((a,b)=>a.id<b.id?-1:1);render()}));
    subs.push(onSnapshot(doc(db,'config','bank'),s=>{S.bank=s.data()?.text||''}));
    if(S.admin)subs.push(onSnapshot(query(collectionGroup(db,'transactions'),where('status','==','pending')),s=>{S.pend=s.docs.map(d=>({ref:d.ref,...d.data()}));render()},e=>{S.err='Pending list failed: '+e.message;render()}));
  }
  render();
});

function calc(){
  const done=S.tx.filter(t=>t.status==='completed'&&t.units),ms=t=>t.completedAt?.toMillis?.()??0,f=t=>t.type==='deposit'?1:-1;
  const units=done.reduce((a,t)=>a+f(t)*t.units,0),last=S.nav.at(-1),value=last?units*last.nav:0;
  const invested=done.reduce((a,t)=>a+f(t)*t.amount,0);
  const pend=S.tx.filter(t=>t.status==='pending'&&t.type==='withdrawal').reduce((a,t)=>a+t.amount,0);
  const first=Math.min(...done.map(ms));
  const all=S.nav.map(n=>{const t=Date.parse(n.id);return{t,v:done.filter(x=>ms(x)<=t).reduce((a,x)=>a+f(x)*x.units,0)*n.nav}}).filter(p=>p.t>=first&&p.v>0);
  let pts=all.filter(p=>p.t>=Date.now()-DAYS[S.range]*864e5);if(pts.length<2)pts=all.slice(-2);
  let delta=0,pc=0;
  if(pts.length>1){const a=pts[0],b=pts.at(-1),flow=done.filter(x=>ms(x)>a.t&&ms(x)<=b.t).reduce((s,x)=>s+f(x)*x.amount,0);delta=b.v-a.v-flow;pc=a.v?delta/a.v*100:0}
  const pd=S.tx.filter(t=>t.status==='pending'&&t.type==='deposit').reduce((x,t)=>x+t.amount,0);
  return{pd,value,invested,avail:value-pend,pts,delta,pc,ret:value-invested,retPc:invested>0?(value-invested)/invested*100:0}
}

function txList(n,f){
  const l=(f?S.tx.filter(f):S.tx).slice(0,n||1e9);
  if(!l.length)return`<p class="mut">${f?'Nothing pending.':'No deposits or withdrawals yet. Make a deposit to start.'}</p>`;
  return l.map(t=>`<div class="tx"><div><b>${t.type==='deposit'?'Deposit':'Withdrawal'}</b><div class="mut">${day(t.createdAt?.toDate?.()??new Date())}</div></div><div style="text-align:right"><b>${t.type==='deposit'?'+':'−'}${money(t.amount)}</b><div><span class="chip ${t.status}">${t.status[0].toUpperCase()+t.status.slice(1)}</span></div></div></div>`).join('');
}

function chart(pts){
  if(pts.length<2)return`<div class="empty">Performance appears here once Kaulto confirms your first deposit.</div>`;
  const W=800,H=240,p=12,x0=pts[0].t,x1=pts.at(-1).t,vs=pts.map(q=>q.v),lo=Math.min(...vs),sp=(Math.max(...vs)-lo)||1;
  const X=t=>p+(t-x0)/((x1-x0)||1)*(W-2*p),Y=v=>H-p-(v-lo)/sp*(H-2*p);
  const d=pts.map((q,i)=>(i?'L':'M')+X(q.t).toFixed(1)+' '+Y(q.v).toFixed(1)).join('');
  return`<svg id="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Portfolio value over time"><path d="${d}L${X(x1)} ${H}L${X(x0)} ${H}Z" fill="rgba(0,0,0,.06)"/><path d="${d}" fill="none" stroke="#000" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cl" y1="0" y2="${H}" stroke="#000" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>`;
}
function hover(pts){
  const s=$('#ch');if(!s)return;const x0=pts[0].t,x1=pts.at(-1).t,tip=$('#tip'),line=$('#cl'),base=tip.innerHTML;
  s.onpointermove=e=>{const r=s.getBoundingClientRect(),fr=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),t=x0+fr*(x1-x0);
    const q=pts.reduce((a,b)=>Math.abs(b.t-t)<Math.abs(a.t-t)?b:a);
    const x=12+(q.t-x0)/((x1-x0)||1)*776;line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('visibility','visible');
    tip.textContent=day(new Date(q.t))+' · '+money(q.v)};
  s.onpointerleave=()=>{line.setAttribute('visibility','hidden');tip.innerHTML=base};
}

function render(){
  if(!S.user)return authView();
  if(S.denied)return deniedView();
  const c=calc(),v=S.view,n=S.nav,fp=n.length>1?(n.at(-1).nav/n[0].nav-1)*100:null;
  const nav=[['portfolio','Portfolio'],['funds','Manage funds'],['activity','Activity'],['settings','Settings'],...(S.admin?[['admin','Admin']]:[])].map(([k,l])=>`<button data-v="${k}" ${v===k?'aria-current="page"':''}>${l}</button>`).join('');
  let body='';
  if(v==='portfolio')body=`
    <h1>${esc(S.name?S.name+'’s portfolio':'Your portfolio')}</h1>
    <div class="big-n">${money(c.value)}</div>${c.pd?`<div class="mut">${money(c.pd)} deposit pending</div>`:''}
    <div id="tip" class="${cls(c.delta)}">${c.pts.length>1?sgn(c.delta)+' ('+(c.pc>=0?'+':'')+c.pc.toFixed(2)+'%) in this period':'<span class="mut">No performance yet</span>'}</div>
    <div class="row" style="margin-top:16px"><button class="btn dark" data-d="deposit">Deposit</button></div>
    <div class="card">${chart(c.pts)}<div class="ranges">${Object.keys(DAYS).map(r=>`<button data-r="${r}" aria-pressed="${S.range===r}">${r}</button>`).join('')}</div></div>
    <div class="card stats"><div><span class="mut">Total return</span><b class="${cls(c.ret)}">${sgn(c.ret)}</b><span class="mut ${cls(c.ret)}">${c.retPc>=0?'+':''}${c.retPc.toFixed(2)}%</span></div><div><span class="mut">Money paid in</span><b>${money(c.invested)}</b></div><div><span class="mut">Available to withdraw</span><b>${money(c.avail)}</b></div><div><span class="mut">Fund since launch</span><b class="${cls(fp)}">${fp==null?'–':(fp>=0?'+':'')+fp.toFixed(2)+'%'}</b></div></div>
    <div class="card"><h2>Recent activity</h2>${txList(5)}</div>`;
  else if(v==='funds')body=`<h1>Manage funds</h1><div class="card"><span class="mut">Available to withdraw</span><b style="display:block;font-size:26px;letter-spacing:-.02em">${money(c.avail)}</b><div class="row" style="margin-top:14px"><button class="btn dark" data-d="deposit">Deposit</button><button class="btn" data-d="withdrawal">Withdraw</button></div></div><div class="card"><h2>Pending requests</h2>${txList(0,t=>t.status==='pending')}</div>`;
  else if(v==='activity')body=`<h1>Activity</h1><div class="row"><button class="btn" id="csv">Download CSV</button><button class="btn" id="prt">Print statement</button></div><div class="card">${txList()}</div>`;
  else if(v==='admin')body=adminView();
  else body=`<h1>Settings</h1><form class="card" id="sf"><label>Name<input name="name" value="${esc(S.name)}" autocomplete="name"></label><label>Currency<select name="currency">${['GBP','USD','EUR'].map(x=>`<option ${S.set.currency===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Default chart range<select name="range">${Object.keys(DAYS).map(x=>`<option ${S.set.range===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Payout account for withdrawals<input name="payout" value="${esc(S.set.payout||'')}" placeholder="Account name, sort code, account number"></label><label><input type="checkbox" name="hide" ${S.set.hide?'checked':''}>Hide balances</label><p class="mut" id="sv">Changes save to your account automatically. Signed in as ${esc(S.user.email)}.</p></form>`;
  app.innerHTML=`<div class="wrap"><header class="top"><span class="logo">K</span><b class="wm">Kaulto</b><nav>${nav}</nav><button class="link" id="so">Sign out</button></header>${body}</div>`;
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;setDoc(doc(db,'users',S.user.uid),{settings:{...S.set,range:S.range}},{merge:true});render()});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openDlg(b.dataset.d));
  $('#so').onclick=()=>signOut(auth);
  if(v==='portfolio')hover(c.pts);
  if(v==='activity'){$('#csv').onclick=csv;$('#prt').onclick=()=>print()}
  if(v==='admin')bindAdmin();
  const sf=$('#sf');if(sf)sf.onchange=async()=>{const f=new FormData(sf);
    await setDoc(doc(db,'users',S.user.uid),{name:f.get('name').trim(),settings:{currency:f.get('currency'),range:f.get('range'),hide:!!f.get('hide'),payout:f.get('payout').trim()}},{merge:true});
    const sv=$('#sv');if(sv)sv.textContent='Saved to your account.'};
}

function authView(){
  app.innerHTML=`<main class="auth"><span class="logo big">K</span><h1>Sign in to Kaulto</h1><p class="mut">Use your Google account to see your portfolio.</p><p class="err" role="alert">${S.err}</p><button class="btn dark" id="g">Continue with Google</button></main>`;
  $('#g').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){S.err=['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(x.code)?'':'Google sign-in did not complete. Check that pop-ups are allowed and try again.';authView()}};
}

function csv(){const r=['Date,Type,Amount,Status',...S.tx.map(t=>[(t.createdAt?.toDate?.()??new Date()).toISOString().slice(0,10),t.type,t.amount,t.status].join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/csv'}));a.download='kaulto-activity.csv';a.click()}

function deniedView(){app.innerHTML=`<main class="auth"><span class="logo big">K</span><h1>Account not approved yet</h1><p class="mut">${esc(S.user.email)} isn’t on Kaulto’s approved list. Ask Kaulto to add this email, then sign in again.</p><button class="btn" id="so">Sign out</button></main>`;$('#so').onclick=()=>signOut(auth)}

function adminView(){
  const px=S.pend.map((t,i)=>`<div class="tx"><div><b>${esc(t.name||'')} <span class="mut">${esc(t.email||'')}</span></b><div class="mut">${t.type==='deposit'?'Deposit':'Withdrawal'} · ${fmt(t.amount)}</div></div><div class="row"><button class="btn dark" data-ok="${i}">Confirm</button><button class="btn" data-no="${i}">Reject</button></div></div>`).join('')||'<p class="mut">No pending requests.</p>',l=S.nav.at(-1);
  return`<h1>Admin</h1><div class="card"><h2>Pending requests</h2><p class="err">${esc(S.err)}</p>${px}</div>
  <form class="card" id="nf"><h2>Daily price</h2><label>Date<input type="date" name="d" value="${new Date().toISOString().slice(0,10)}" required></label><label>Price per unit<input name="p" type="number" step="0.0001" min="0.0001" required></label><button class="btn dark" style="margin-top:14px">Save price</button><p class="mut">Latest saved: ${l?l.id+' at '+l.nav:'none yet'}. Confirmations use the latest price.</p></form>
  <form class="card" id="af2"><h2>Approve an investor</h2><label>Google account email<input name="e" type="email" required></label><button class="btn dark" style="margin-top:14px">Approve</button><p class="mut" id="am"></p></form>
  <form class="card" id="bf"><h2>Bank details shown on deposits</h2><label>Details<input name="b" value="${esc(S.bank)}" placeholder="Account name, sort code, account number"></label><button class="btn dark" style="margin-top:14px">Save details</button></form>`;
}
function bindAdmin(){
  const l=S.nav.at(-1),act=(i,ok)=>{const t=S.pend[i];if(!ok)return updateDoc(t.ref,{status:'rejected'});if(!l){S.err='Save a price first.';return render()}S.err='';return updateDoc(t.ref,{status:'completed',units:Math.round(t.amount/l.nav*1e6)/1e6,completedAt:serverTimestamp()})};
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>act(+b.dataset.ok,1));
  app.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>act(+b.dataset.no,0));
  $('#nf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await setDoc(doc(db,'nav',f.get('d')),{nav:parseFloat(f.get('p'))})};
  $('#af2').onsubmit=async e=>{e.preventDefault();const m=new FormData(e.target).get('e').trim().toLowerCase();await setDoc(doc(db,'allowed',m),{addedAt:serverTimestamp()});$('#am').textContent=m+' approved.';e.target.reset()};
  $('#bf').onsubmit=async e=>{e.preventDefault();await setDoc(doc(db,'config','bank'),{text:new FormData(e.target).get('b').trim()})};
}

function openDlg(type){
  const dep=type==='deposit',c=calc(),ref='KAULTO-'+S.user.uid.slice(0,6).toUpperCase(),max=Math.max(0,c.avail);
  let a=0;
  const row=(t,l)=>`<div class="tx"><div><span class="mut">${l}</span><br><b>${esc(t)}</b></div><button type="button" class="link" data-c="${esc(t)}">Copy</button></div>`;
  const det=()=>dep?(S.bank?row(S.bank,'Send to'):'<p class="err">Kaulto hasn’t added bank details yet.</p>')+row(ref,'Payment reference'):row(S.set.payout,'Paid to');
  const wire=()=>{dlg.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.c);b.textContent='Copied'});const x=$('#cx');if(x)x.onclick=()=>dlg.close()};
  const step1=()=>{
    dlg.innerHTML=`<form id="mf"><h2>${dep?'Deposit':'Withdraw'}</h2><label>Amount (${S.set.currency})<input name="a" type="number" min="1" step="0.01" inputmode="decimal" value="${a||''}" required></label>${dep?'':`<p class="mut">${fmt(max)} available. <button type="button" class="link" id="all">Withdraw all</button></p>`}<p class="err" role="alert"></p><div class="row"><button type="button" class="btn" id="cx">Cancel</button><button class="btn dark">Continue</button></div></form>`;wire();
    if(!dep)$('#all').onclick=()=>{dlg.querySelector('[name=a]').value=max.toFixed(2)};
    $('#mf').onsubmit=e=>{e.preventDefault();a=Math.round(parseFloat(new FormData(e.target).get('a'))*100)/100;const er=dlg.querySelector('.err');
      if(!(a>0))return er.textContent='Enter an amount above zero.';
      if(!dep&&a>max+1e-9)return er.textContent=`You can withdraw up to ${fmt(max)}.`;
      if(!dep&&!S.set.payout)return er.textContent='Add a payout account in Settings first.';
      step2()};
  };
  const step2=()=>{
    dlg.innerHTML=`<form id="mf"><h2>Review ${dep?'deposit':'withdrawal'}</h2><div class="big-n" style="font-size:34px">${fmt(a)}</div>${det()}<p class="mut">${dep?'Make the bank transfer using this reference. Your balance updates once Kaulto confirms it arrived.':'Kaulto confirms the withdrawal before it leaves your balance.'}</p><p class="err" role="alert"></p><div class="row"><button type="button" class="btn" id="bk">Back</button><button class="btn dark">${dep?'Deposit':'Withdraw'} ${fmt(a)}</button></div></form>`;wire();$('#bk').onclick=step1;
    $('#mf').onsubmit=async e=>{e.preventDefault();
      try{await addDoc(collection(db,'users',S.user.uid,'transactions'),{type,amount:a,status:'pending',createdAt:serverTimestamp(),name:S.name,email:S.user.email});step3()}
      catch{dlg.querySelector('.err').textContent='That didn’t go through. Check your connection and try again.'}};
  };
  const step3=()=>{
    dlg.innerHTML=`<div><h2>${dep?'Deposit':'Withdrawal'} started</h2><p><b>${fmt(a)}</b> is pending. ${dep?'Send the transfer using the details below. It shows in your balance once Kaulto confirms it.':'It stays pending in Activity until Kaulto confirms it.'}</p>${dep?det():''}<div class="row"><button class="btn dark" id="cx">Done</button></div></div>`;wire();
  };
  step1();dlg.showModal();
}
}
</script>
</body>
</html>
